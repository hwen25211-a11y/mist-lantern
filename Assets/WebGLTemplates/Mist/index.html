<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雾灯遗城 · Mist Lantern</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#0c1c27;color:#eee1c5;font-family:system-ui,"PingFang SC",sans-serif;display:flex;flex-direction:column}
    header{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #30424c;font-size:14px}
    header strong{letter-spacing:3px;color:#d6b67a}button{border:1px solid #6c6c59;background:#233c48;color:#eee1c5;padding:7px 17px;cursor:pointer;font:inherit}
    main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
    #frame{position:relative;width:min(100vw,calc((100dvh - 94px)*16/9));aspect-ratio:16/9;background:#152a38}
    canvas{display:block;width:100%;height:100%;outline:none}canvas:fullscreen{width:100vw;height:100vh}
    #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#152a38}
    #loading strong{font-size:32px;letter-spacing:8px;color:#d6b67a}progress{width:min(340px,70%);height:7px;accent-color:#d6b67a}
    #status{font-size:14px;color:#b9c9ce;max-width:80%;text-align:center;line-height:1.8}
    footer{height:42px;flex:none;display:flex;align-items:center;justify-content:center;color:#9badb5;font-size:12px;padding:0 16px;text-align:center}
    @media(max-width:650px){header{padding:0 12px}header span{display:none}footer{font-size:10px}}
  </style>
</head>
<body>
  <header><strong>雾灯遗城</strong><span>一盏灯，一座城，一次归途 · v1.1.0</span><button id="fullscreen" type="button">全屏游玩</button></header>
  <main><div id="frame"><canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="雾灯遗城游戏画面"></canvas><div id="loading"><strong>雾灯遗城</strong><progress id="progress" max="1" value="0"></progress><div id="status">正在点亮提灯…首次加载需要稍候。</div></div></div></main>
  <footer>WASD 移动 · J 攻击 · K 闪避 · Space 跳跃 · L 技能 · Q 灯态 · R 放灯 · C 格挡 · F 药水 · Esc 暂停　｜　默认静音</footer>
  <script>
    const canvas=document.getElementById("unity-canvas");
    const script=document.createElement("script");
    script.src="Build/{{{ LOADER_FILENAME }}}";
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:"Build/{{{ DATA_FILENAME }}}",
      frameworkUrl:"Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:"Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl:"StreamingAssets",
      companyName:"Mist Lantern Studio",productName:"雾灯遗城",productVersion:"1.1.0",
      matchWebGLToCanvasSize:true,
      showBanner:(message,type)=>{if(type==="error"){document.getElementById("status").textContent="加载遇到问题："+message;document.getElementById("loading").style.display="flex";}}
    },p=>document.getElementById("progress").value=p).then(instance=>{
      document.getElementById("loading").style.display="none";
      document.getElementById("fullscreen").onclick=()=>instance.SetFullscreen(1);
      canvas.focus();
    }).catch(e=>document.getElementById("status").textContent="未能加载游戏。请使用启动器打开，或刷新重试。"+e.message);
    script.onerror=()=>document.getElementById("status").textContent="游戏文件加载失败，请确认完整解压后使用启动器打开。";
    document.body.appendChild(script);
  </script>
</body>
</html>
